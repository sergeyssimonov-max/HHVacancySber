name: macOS

on:
  push:
  pull_request:

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        run: |
          test "$(uname -m)" = arm64
          legacy_project='HHVacancy''Desk'
          legacy_bundle='local.sergey.HHVacancy''Desk'
          if grep -R -q -E "${legacy_project}|${legacy_bundle}" HHVacancySber README.md; then
            echo "Legacy project or bundle name found" >&2
            exit 1
          fi
          auth_config='HHVacancySber/HHVacancySber/HHAuthConfig.swift'
          grep -Eq 'static let appAccessToken = "[^"]+"' "$auth_config"
          if grep -q 'static let appAccessToken = placeholderAccessToken' "$auth_config"; then
            echo "Application token references the placeholder" >&2
            exit 1
          fi
          if grep -q 'static let appAccessToken = "REPLACE_WITH_YOUR_HH_APPLICATION_TOKEN"' "$auth_config"; then
            echo "Application token is the placeholder" >&2
            exit 1
          fi
      - name: List project
        working-directory: HHVacancySber
        run: xcodebuild -project HHVacancySber.xcodeproj -list
      - name: Test release tooling
        run: /usr/bin/python3 -m unittest discover -s scripts/tests -v
      - name: Build Debug
        working-directory: HHVacancySber
        run: >-
          xcodebuild -project HHVacancySber.xcodeproj -scheme HHVacancySber
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO build
      - name: Test Debug
        working-directory: HHVacancySber
        run: >-
          xcodebuild -project HHVacancySber.xcodeproj -scheme HHVacancySber
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO test -only-testing:HHVacancySberTests

  # Same compiler settings as scripts/release.sh: CI must fail where the release build fails.
  release-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build Release with strict concurrency
        working-directory: HHVacancySber
        run: >-
          xcodebuild -project HHVacancySber.xcodeproj -scheme HHVacancySber
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -disableAutomaticPackageResolution
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          CODE_SIGNING_ALLOWED=NO build

  ui-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # XCUITest launches the app and its runner, so both are signed ad hoc
      # instead of skipping signing as the unit-test job does.
      - name: Test UI
        working-directory: HHVacancySber
        run: >-
          xcodebuild -project HHVacancySber.xcodeproj -scheme HHVacancySber
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -resultBundlePath "$RUNNER_TEMP/UITests.xcresult"
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          test -only-testing:HHVacancySberUITests
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/UITests.xcresult
          retention-days: 7
